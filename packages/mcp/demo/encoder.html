<!doctype html>
<meta charset="utf-8">
<title>encoder</title>
<script type="module">
import { buildPalette, countColors, GifWriter } from './gif.mjs';

/** The same recording as an animated GIF, smaller and slower, for READMEs. */
window.encodeGif = async ({ width = 960, height = 540, fps = 10 } = {}) => {
  const { frames, duration } = await (await fetch('/frames.json')).json();
  const canvas = new OffscreenCanvas(width, height);
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  const pixelsOf = async (index) => {
    const bitmap = await createImageBitmap(await (await fetch(`/frames/${frames[index].file}`)).blob());
    ctx.drawImage(bitmap, 0, 0, width, height);
    bitmap.close();
    return ctx.getImageData(0, 0, width, height).data;
  };
  const frameAt = (t) => {
    let i = 0;
    while (i + 1 < frames.length && frames[i + 1].t <= t) i++;
    return i;
  };
  // One palette from a frame every half second.
  const counts = new Uint32Array(32768);
  for (let t = 0; t < duration; t += 0.5) countColors(await pixelsOf(frameAt(t)), counts);
  const { palette, lookup } = buildPalette(counts);
  const gif = new GifWriter({ width, height, palette, lookup });
  const total = Math.round(duration * fps);
  let shown = -1;
  let pixels;
  for (let k = 0; k < total; k++) {
    const index = frameAt(k / fps);
    if (index !== shown) {
      pixels = await pixelsOf(index);
      shown = index;
    }
    gif.add(pixels, 100 / fps);
  }
  const bytes = gif.finish();
  const res = await fetch('/gif', { method: 'POST', body: bytes });
  return { status: res.status, frames: total, bytes: bytes.length };
};
</script>
<script>
/**
 * Turns the captured frames into H.264 with WebCodecs, at a constant frame rate:
 * each output frame shows the latest capture at its time. record.mjs writes the MP4.
 */
window.encode = async () => {
  const { frames, width, height, fps, duration, bitrate } = await (await fetch('/frames.json')).json();
  const canvas = new OffscreenCanvas(width, height);
  const ctx = canvas.getContext('2d');
  const chunks = [];
  let description;
  let failure;
  const encoder = new VideoEncoder({
    output(chunk, meta) {
      if (meta?.decoderConfig?.description && !description) description = new Uint8Array(meta.decoderConfig.description);
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      chunks.push({ data, key: chunk.type === 'key', timestamp: chunk.timestamp });
    },
    error(e) { failure = e; },
  });
  encoder.configure({ codec: 'avc1.640028', width, height, bitrate, framerate: fps, avc: { format: 'avc' }, latencyMode: 'quality' });

  const total = Math.round(duration * fps);
  let shown = -1;
  let next = 0;
  for (let k = 0; k < total; k++) {
    const t = k / fps;
    while (next < frames.length && frames[next].t <= t) next++;
    const index = Math.max(0, next - 1);
    if (index !== shown) {
      const blob = await (await fetch(`/frames/${frames[index].file}`)).blob();
      const bitmap = await createImageBitmap(blob);
      ctx.drawImage(bitmap, 0, 0, width, height);
      bitmap.close();
      shown = index;
    }
    const frame = new VideoFrame(canvas, { timestamp: Math.round((k * 1e6) / fps), duration: Math.round(1e6 / fps) });
    encoder.encode(frame, { keyFrame: k % (fps * 5) === 0 });
    frame.close();
    while (encoder.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 2));
    if (failure) throw failure;
  }
  await encoder.flush();
  if (failure) throw failure;

  // Send the samples back: a JSON header, then the data.
  const header = new TextEncoder().encode(JSON.stringify({
    description: Array.from(description),
    samples: chunks.map((c) => ({ size: c.data.length, key: c.key, timestamp: c.timestamp })),
  }));
  const body = new Blob([new Uint32Array([header.length]), header, ...chunks.map((c) => c.data)]);
  const res = await fetch('/video', { method: 'POST', body });
  return { status: res.status, frames: total, chunks: chunks.length };
};
</script>
