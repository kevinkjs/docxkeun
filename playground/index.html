<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>docxkeun playground</title>
    <style>
      html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; color: #202124; }
      body { display: flex; flex-direction: column; }
      header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #dadce0; flex-wrap: wrap; background: #fff; }
      header h1 { font-size: 15px; margin: 0 8px 0 0; }
      button, select, input[type=file] { font: inherit; }
      #status { margin-left: auto; color: #5f6368; }
      main { flex: 1; min-height: 0; display: flex; }
      #viewer { flex: 1; min-width: 0; }
      #nav { width: 260px; flex: none; overflow: auto; border-right: 1px solid #dadce0; background: #fff; font-size: 13px; }
      #nav[hidden] { display: none; }
      #nav .history { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #e8eaed; position: sticky; top: 0; background: #fff; }
      #nav section { border-bottom: 1px solid #e8eaed; padding: 8px 0; }
      #nav h2 { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #5f6368; margin: 0; padding: 4px 12px; }
      #nav h2 .count { font-weight: 400; }
      #nav h2 .step { margin-left: auto; display: flex; gap: 2px; }
      #nav h2 .step button { padding: 0 6px; line-height: 20px; }
      #nav ul { list-style: none; margin: 0; padding: 0; }
      #nav li button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 4px 12px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #nav li button:hover { background: #f1f3f4; }
      #nav li button:focus-visible { outline: 2px solid #1a73e8; outline-offset: -2px; }
      #nav li.active button { background: #e8f0fe; color: #1967d2; }
      #nav .meta { color: #80868b; font-size: 12px; margin-left: 6px; }
      #nav .empty { color: #80868b; padding: 4px 12px; }
      #nav label { display: flex; gap: 6px; align-items: center; padding: 4px 12px; color: #5f6368; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>docxkeun</h1>
      <input type="file" id="file" accept=".docx,.dotx,.docm" />
      <button id="sample">Sample</button>
      <button id="navToggle" aria-pressed="true">Navigation</button>
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <span id="zoom">100%</span>
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <span id="actions"></span>
      <span id="status"></span>
    </header>
    <main>
      <aside id="nav" aria-label="Document navigation"></aside>
      <div id="viewer"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
