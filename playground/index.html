<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>docxkeun playground</title>
    <style>
      html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; color: #202124; }
      body { display: flex; flex-direction: column; }
      header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #dadce0; flex-wrap: wrap; background: #fff; }
      header h1 { font-size: 15px; margin: 0 8px 0 0; }
      button, select, input[type=file] { font: inherit; }
      #status { margin-left: auto; color: #5f6368; }
      #viewer { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>docxkeun</h1>
      <input type="file" id="file" accept=".docx,.dotx,.docm" />
      <button id="sample">Sample</button>
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <span id="zoom">100%</span>
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <span id="actions"></span>
      <span id="status"></span>
    </header>
    <div id="viewer"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
